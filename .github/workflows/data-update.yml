name: Update NSI Data

on:
  schedule:
    # Daily at 03:00 UTC (05:00 or 06:00 Sofia time depending on DST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dataset_ids:
        description: 'Space-separated NSI IDs to update (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download latest NSI data
        id: download
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.dataset_ids }}" ]; then
            npx tsx scripts/update-nsi-data.ts ${{ github.event.inputs.dataset_ids }}
          else
            npx tsx scripts/update-nsi-data.ts
          fi

      - name: Check for CSV changes
        id: csv-changes
        run: |
          git add source_data/
          if git diff --cached --quiet source_data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CSV changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CSV changes detected."
          fi

      - name: Validate NSI data structure
        if: steps.csv-changes.outputs.changed == 'true'
        run: npm run validate-data
        # No continue-on-error: validation failures block rebuild and push.
        # A FAIL exit means NSI changed column names or removed required filter codes,
        # which would break dashboards. The maintainer must investigate before pushing.

      - name: Rebuild prebuilt JSON files
        if: steps.csv-changes.outputs.changed == 'true'
        run: npm run prebuild

      - name: Check for final changes
        if: steps.csv-changes.outputs.changed == 'true'
        id: final-changes
        run: |
          git add source_data/
          git add --force public/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            CHANGED_COUNT=$(git diff --cached --name-only | wc -l)
            echo "file_count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes directly to master
        if: steps.final-changes.outputs.changed == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source_data/
          git add --force public/data/
          git commit -m "chore(data): update NSI data ($DATE)

          Automated daily refresh from nsi.bg/opendata.
          Changed files: ${{ steps.final-changes.outputs.file_count }}"

          git push origin HEAD:master

  # This job satisfies the "build" required status check on the master branch.
  # Branch protection requires it to pass; the CI workflow only runs on PRs,
  # so direct pushes from update-data were always failing the check.
  build:
    needs: update-data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate NSI data
        run: npm run validate-data

      - name: Build
        run: npm run build
