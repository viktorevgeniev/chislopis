name: Dashboard E2E Tests

on:
  # Run automatically after the data-update workflow completes on master
  workflow_run:
    workflows: ['Update NSI Data']
    types: [completed]
    branches: [master]
  # Also allow manual trigger for investigation
  workflow_dispatch:
    inputs:
      base_url:
        description: 'App URL to test (leave empty to build and test locally)'
        required: false
        default: ''

permissions:
  contents: read
  # Needed to post test results as a check on the triggering workflow
  checks: write

jobs:
  e2e:
    # Only run if the triggering workflow succeeded (skip if data-update failed)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        # Required before `npm start` (next start needs a built .next/ directory)
        if: ${{ github.event.inputs.base_url == '' || github.event.inputs.base_url == null }}
        run: npm run build

      - name: Run E2E tests
        env:
          # Use provided URL if given (e.g. Vercel preview), otherwise localhost
          BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
